<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#087f55" />
    <meta name="description" content="NaijaVoice AI — a future voice for Nigerian languages. Explore our Yoruba-first AI speech preview." />
    <title>NaijaVoice AI — Our languages. Our voice.</title>
    <script>
      try {
        const saved = localStorage.getItem('naijavoice-theme');
        document.documentElement.classList.toggle('dark', saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches);
      } catch {}
    </script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
